<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="1D2S の譜面フォルダに置く title.json を、ブラウザだけで作成・検証・出力できるエディタです。">
  <title>1D2S 称号エディタ | title.json ジェネレーター</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main">本文へ移動</a>

  <div id="app" class="app">
    <header id="app-header" class="app-header"></header>
    <main id="main" class="main" tabindex="-1"></main>
    <footer id="app-footer" class="app-footer"></footer>
  </div>

  <div id="modal-root" class="modal-root" hidden></div>
  <div id="toast-root" class="toast-root" role="status" aria-live="polite" aria-atomic="false"></div>
  <div id="drop-overlay" class="drop-overlay" hidden>
    <div class="drop-card">
      <span class="drop-icon" aria-hidden="true"></span>
      <strong>title.json をドロップ</strong>
      <span>JSON を読み込んで編集を開始します。</span>
    </div>
  </div>

  <input id="json-file-input" type="file" accept=".json,application/json" hidden>

  <script src="core.js"></script>
  <script src="app.js"></script>
</body>
</html>
