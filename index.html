<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="1D2S の譜面制作を支援する Web ツール一覧です。">
  <title>1D2S Tools</title>
  <style>
    :root {
      --bg: #f4f0e8;
      --surface: #fffdf8;
      --ink: #262523;
      --muted: #746f66;
      --line: #d9d1c4;
      --accent: #c8452c;
      --accent-dark: #a93620;
      --accent-pale: #f9e9e5;
      --shadow: 0 18px 50px rgba(80, 58, 38, .12);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      color: var(--ink);
      background:
        radial-gradient(circle at 90% 10%, rgba(200, 69, 44, .09), transparent 28rem),
        linear-gradient(180deg, #f8f4ec 0%, var(--bg) 100%);
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      line-height: 1.7;
    }

    .page {
      width: min(760px, 100%);
      padding: clamp(28px, 5vw, 56px);
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255, 253, 248, .92);
      box-shadow: var(--shadow);
    }

    .eyebrow {
      margin: 0 0 18px;
      color: var(--accent);
      font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .18em;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 7vw, 58px);
      line-height: 1.1;
      letter-spacing: -.04em;
    }

    .lead {
      max-width: 36rem;
      margin: 18px 0 34px;
      color: var(--muted);
      font-size: 14px;
    }

    .tools {
      display: grid;
      gap: 12px;
    }

    .tool {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 20px 22px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: inherit;
      background: var(--surface);
      text-decoration: none;
      transition: border-color .15s ease, transform .15s ease, background .15s ease;
    }

    .tool:hover {
      border-color: var(--accent);
      background: var(--accent-pale);
      transform: translateY(-1px);
    }

    .tool:focus-visible {
      outline: 3px solid rgba(200, 69, 44, .35);
      outline-offset: 2px;
    }

    .tool-name {
      display: block;
      font-size: 17px;
      font-weight: 700;
    }

    .tool-desc {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
    }

    .tool-arrow {
      flex: none;
      color: var(--accent);
      font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
      font-size: 20px;
    }

    .note {
      margin: 30px 0 0;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
    }

    .note a {
      color: var(--accent-dark);
      text-underline-offset: 3px;
    }
  </style>
</head>
<body>
  <main class="page">
    <p class="eyebrow">1D2S / WEB TOOLS</p>
    <h1>1D2S Tools</h1>
    <p class="lead">1D2S の譜面制作を支援する、ブラウザだけで使えるツールです。</p>

    <nav class="tools" aria-label="ツール一覧">
      <a class="tool" href="title-editor/">
        <span>
          <span class="tool-name">称号エディタ</span>
          <span class="tool-desc">title.json の作成・検証・出力</span>
        </span>
        <span class="tool-arrow" aria-hidden="true">→</span>
      </a>
    </nav>

    <p class="note">
      入力内容はブラウザ内で処理されます。
      <a href="https://github.com/GabbaAim/1d2s-tools">GitHub リポジトリ</a>
    </p>
  </main>
</body>
</html>
